<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Rumah Naraya</title>
<style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#17233b}.box{max-width:900px;margin:30px auto;background:white;padding:25px;border-radius:18px}h1,h2{color:#102f67}input,button{padding:11px;margin:5px 0;border-radius:9px;border:1px solid #ddd}input{width:100%;box-sizing:border-box}button{background:#102f67;color:white;font-weight:bold}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;border:1px solid #e2e8f1;border-radius:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<body><div id="login" class="box"><h1>🔐 Dashboard Rumah Naraya</h1><p>Admin pribadi.</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button onclick="loginAdmin()">Masuk</button><p id="msg"></p></div>
<div id="app" class="box hidden"><h1>Dashboard Rumah Naraya 👋</h1><button onclick="logoutAdmin()">Keluar</button><div class="grid"><div class="card"><h2>👨‍🎓 Siswa</h2><p>Data siswa aktif</p></div><div class="card"><h2>📅 Jadwal</h2><p>Sesi belajar</p></div><div class="card"><h2>✅ Absensi</h2><p>Kehadiran</p></div><div class="card"><h2>💰 Pembayaran</h2><p>Keuangan</p></div><div class="card"><h2>📚 Laporan</h2><p>Perkembangan</p></div><div class="card"><h2>📝 Pendaftaran</h2><p>Calon siswa</p></div></div></div>
<script>async function check(){let r=await fetch('/api/me');if(r.ok)openApp()}async function loginAdmin(){msg.textContent='';let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let j=await r.json();if(!r.ok){msg.textContent=j.error||'Login gagal';return}openApp()}function openApp(){login.classList.add('hidden');app.classList.remove('hidden')}async function logoutAdmin(){await fetch('/api/logout',{method:'POST'});location.reload()}check()</script></body></html>
